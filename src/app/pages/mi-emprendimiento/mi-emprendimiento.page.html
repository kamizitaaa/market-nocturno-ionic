<app-header></app-header>

<ion-content [fullscreen]="true" class="mi-emp-content">

  <div class="mi-emp-container" *ngIf="!cargando">

    <h1 class="mi-emp-titulo">
      <ion-icon [name]="tieneEmprendimiento ? 'storefront-outline' : 'add-circle-outline'"></ion-icon>
      {{ tieneEmprendimiento ? 'Mi Emprendimiento' : 'Crea tu Emprendimiento' }}
    </h1>

    <p class="mi-emp-subtitulo" *ngIf="!tieneEmprendimiento">
      Aún no tienes un emprendimiento registrado. Completa el formulario para crear el tuyo.
    </p>

    <div class="form-card">

      <div class="form-group" *ngIf="tieneEmprendimiento">
        <label>Imagen del negocio</label>
        <img *ngIf="emprendimiento?.imagen" [src]="emprendimiento?.imagen" class="preview-imagen">
        <input type="file" accept="image/*" (change)="onArchivoSeleccionado($event)">
        <button
          type="button"
          class="btn-subir-imagen"
          (click)="subirImagen()"
          [disabled]="subiendoImagen || !archivoSeleccionado">
          {{ subiendoImagen ? 'Subiendo...' : 'Subir imagen' }}
        </button>
      </div>

      <div class="form-group">
        <label>Nombre del negocio</label>
        <input type="text" [(ngModel)]="form.nombre" placeholder="Ej. Tacos El Buen Sabor">
      </div>

      <div class="form-group">
        <label>Categoría</label>
        <select [(ngModel)]="form.categoria_id">
          <option [ngValue]="null" disabled>Selecciona una categoría</option>
          <option *ngFor="let cat of categorias" [ngValue]="cat.id">{{ cat.nombre }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea [(ngModel)]="form.descripcion" rows="3" placeholder="Cuéntale a tus clientes sobre tu negocio"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Precio desde</label>
          <input type="number" [(ngModel)]="form.precio_desde" placeholder="30">
        </div>
        <div class="form-group">
          <label>Precio hasta</label>
          <input type="number" [(ngModel)]="form.precio_hasta" placeholder="80">
        </div>
      </div>

      <button class="btn-guardar" (click)="guardar()" [disabled]="guardando">
        <ion-icon name="save-outline"></ion-icon>
        {{ guardando ? 'Guardando...' : (tieneEmprendimiento ? 'Guardar cambios' : 'Crear emprendimiento') }}
      </button>
    </div>

  </div>

</ion-content>
