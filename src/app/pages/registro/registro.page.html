<app-header></app-header>

<ion-content [fullscreen]="true">
  <div class="registro-container">
    <div class="registro-box">

      <h2>CREA TU CUENTA</h2>
      <p class="subtitle">Regístrate para hacer pedidos</p>

      <div class="form-row">
        <div class="form-group">
          <label>Nombre/s *</label>
          <input type="text" [(ngModel)]="nombre" placeholder="Tu nombre" class="custom-input">
        </div>
        <div class="form-group">
          <label>Teléfono *</label>
          <input type="tel" [(ngModel)]="telefono" placeholder="449 000 0000" class="custom-input">
        </div>
      </div>

      <div class="form-group">
        <label>Apellido paterno *</label>
        <input type="text" [(ngModel)]="apellidoPaterno" placeholder="Apellido paterno" class="custom-input">
      </div>

      <div class="form-group">
        <label>Apellido materno *</label>
        <input type="text" [(ngModel)]="apellidoMaterno" placeholder="Apellido materno" class="custom-input">
      </div>

      <div class="form-group">
        <label>Correo electrónico *</label>
        <input type="email" [(ngModel)]="email" placeholder="tu@gmail.com" class="custom-input">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Contraseña *</label>
          <div class="input-password">
            <input [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="••••••••" class="custom-input">
            <ion-icon [name]="mostrarPassword ? 'eye-off-outline' : 'eye-outline'" (click)="togglePassword()"></ion-icon>
          </div>
        </div>
        <div class="form-group">
          <label>Confirmar contraseña *</label>
          <div class="input-password">
            <input [type]="mostrarConfirm ? 'text' : 'password'" [(ngModel)]="confirmarPassword" placeholder="••••••••" class="custom-input">
            <ion-icon [name]="mostrarConfirm ? 'eye-off-outline' : 'eye-outline'" (click)="toggleConfirm()"></ion-icon>
          </div>
        </div>
      </div>

      <button class="btn-registro" (click)="registrar()">→ Crear cuenta</button>

      <p class="login-link">
        ¿Ya tienes una cuenta? <a routerLink="/login">Inicia Sesión</a>
      </p>

    </div>
  </div>
